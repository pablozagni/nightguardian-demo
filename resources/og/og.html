<!DOCTYPE html>

<style>

    h1 em { font-style: normal; color: #f5b942; }
    p { color: #a0abcd; font-size: 30px; max-width: 700px; }
    .tags { position: absolute; left: 80px; bottom: 56px; display: flex; gap: 14px; font-size: 22px; font-weight: 700; }
    .tags span { padding: 8px 18px; border-radius: 999px; border: 1px solid #34437a; background: rgb(17 26 54 / .85); color: #ffd98a; }

</head>
